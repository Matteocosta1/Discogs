name: Copertine prova
# Ramo temporaneo: scarica le copertine Discogs dei 12 dischi del mockup (da qui Discogs non si raggiunge). Si cancella subito dopo.
on:
  push:
    branches: [claude/copertine-prova]
permissions:
  contents: write
jobs:
  copertine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 prendi.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add copertine; git commit -m "copertine" || true; git push
