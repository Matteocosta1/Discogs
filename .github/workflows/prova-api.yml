name: Prova API artista
on: push
jobs:
  prova:
    if: github.ref == 'refs/heads/claude/prova-api-artista'
    runs-on: ubuntu-latest
    steps:
      - run: |
          H='User-Agent: VinylHustler/1.0'
          echo "== artista"; curl -s -H "$H" https://api.discogs.com/artists/1289 | python3 -c "import sys,json; d=json.load(sys.stdin); print(list(d.keys())); print(d.get('name'), d.get('realname'), [m.get('name') for m in d.get('members',[])], d.get('images','NO IMAGES')[:1] if isinstance(d.get('images'),list) else d.get('images','NO IMAGES')); print(d.get('profile','')[:400])"
          echo "== uscite"; curl -s -H "$H" "https://api.discogs.com/artists/1289/releases?per_page=5&sort=year&sort_order=asc" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('pagination')); [print(json.dumps(x)) for x in d.get('releases',[])]"
          echo "== ricerca senza chiave"; curl -s -o /dev/null -w "%{http_code}\n" -H "$H" "https://api.discogs.com/database/search?q=aux88&type=artist"
