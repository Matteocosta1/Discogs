name: Prova API
on:
  push:
    branches: [claude/copertine-prova]
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA='VinylHustler/1.0 (prova)'
          P='import json,sys; d=json.load(sys.stdin); r=d.get("results",[]); print(d.get("pagination",{}).get("items"), [(x.get("title")[:30], x.get("community",{}).get("want"), x.get("year"), x.get("country"), x.get("master_id"), x.get("style")) for x in r[:6]]); print(sorted(r[0].keys()) if r else d)'
          for q in "type=release&format=Vinyl&sort=want&sort_order=desc&per_page=6" "type=release&format=Vinyl&per_page=6" "type=release&format=Vinyl&genre=Electronic&style=Trip+Hop&decade=1990&country=UK&per_page=6&q=portishead" "type=release&format=Vinyl&q=portishead&sort=year&sort_order=desc&per_page=6"; do echo "== $q"; curl -s -A "$UA" "https://api.discogs.com/database/search?$q" | python3 -c "$P"; sleep 3; done
