name: Prova API
on:
  push:
    branches: [claude/copertine-prova]
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA='Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15'
          for u in https://www.discogs.com/it/release/6276183 https://www.discogs.com/it/master/5460; do
            echo "== $u"; curl -sL -A "$UA" -H 'Accept-Language: it-IT,it;q=0.9' "$u" -o p.html -w "%{http_code}\n"
            python3 - <<'PY'
          import re
          s=open('p.html',encoding='utf-8',errors='ignore').read()
          t=re.sub(r'<[^>]+>',' ',s); t=re.sub(r'\s+',' ',t)
          for k in ['Ce l','Hanno','hanno','Vogliono','vogliono','Possied','Desider','Want','Have','In collezione','Wantlist','Statistiche']:
              for m in re.finditer(re.escape(k), t):
                  print(k, '::', t[max(0,m.start()-60):m.end()+60]); break
          PY
            sleep 3
          done
