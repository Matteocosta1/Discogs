name: prova-annuncio
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="VinylHustler/0.1 +prova"
          INV=$(curl -s -A "$UA" "https://api.discogs.com/users/discosizer_milano/inventory?per_page=1&status=For%20Sale")
          echo "$INV" | head -c 400; echo
          ID=$(echo "$INV" | python3 -c "import sys,json; print(json.load(sys.stdin)['listings'][0]['id'])")
          echo "LISTING $ID"
          curl -s -A "$UA" "https://api.discogs.com/marketplace/listings/$ID?curr_abbr=EUR" | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          print(sorted(d.keys()))
          for k in ['status','price','original_price','condition','sleeve_condition','ships_from','comments','allow_offers','shipping_price','original_shipping_price','posted','uri']: print(k, '=>', d.get(k))
          print('seller', {k: d.get('seller',{}).get(k) for k in ['username','rating','stats','url']})
          print('release', {k: d.get('release',{}).get(k) for k in ['id','description','format','thumbnail']})"
          echo "--- pagina sell/release"
          curl -s -o /dev/null -w "%{http_code}\n" -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)" "https://www.discogs.com/sell/release/249504"
